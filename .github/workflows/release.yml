name: Release

# This repo is private. Releases are cut from the PUBLIC mirror
# jams24/deployzy-cli: on a version tag this workflow syncs the client code
# (cli/, proto/, npm-package/, sdk-js/, sdk-python/, public/*) there and
# pushes the same tag, which starts the public repo's release workflow
# (GoReleaser CLI binaries + Homebrew, npm, PyPI).
#
# Flow: bump the version in proto/messages.go, npm-package/package.json,
# sdk-js/package.json and sdk-python/pyproject.toml → commit →
# `git tag vX.Y.Z && git push origin main --tags`.
#
# Needs a PUBLIC_REPO_TOKEN secret: a fine-grained PAT on jams24/deployzy-cli
# with Contents: read & write and Workflows: read & write. (A push made with
# GITHUB_TOKEN would not trigger the public repo's workflow.)

on:
  push:
    tags:
      - "v*"

jobs:
  sync-public:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync to jams24/deployzy-cli and push the tag
        env:
          PUBLIC_REPO_URL: https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/jams24/deployzy-cli.git
        run: scripts/sync-public.sh "${GITHUB_REF_NAME}"
