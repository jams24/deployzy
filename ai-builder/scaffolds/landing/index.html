<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Landing</title>
<meta name="description" content="" />
<style>
  :root {
    --accent: #34d399;
    --bg: #0a0b0d; --bg2: #101216; --panel: #14161b;
    --border: rgba(255,255,255,0.08);
    --text: #e8eaef; --dim: #9aa0ab; --faint: #5b616c;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  html[data-mode="light"] {
    --bg: #f7f8fa; --bg2: #ffffff; --panel: #ffffff; --border: rgba(0,0,0,0.09);
    --text: #14161b; --dim: #565b66; --faint: #9aa0ab;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  .narrow { max-width: 820px; margin: 0 auto; }
  .glow { position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(800px 500px at 50% -5%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%); }
  .grid-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .45;
    background-image: radial-gradient(circle, var(--border) 1px, transparent 1px); background-size: 42px 42px;
    mask-image: radial-gradient(120% 80% at 50% 0%, black 25%, transparent 75%);
    -webkit-mask-image: radial-gradient(120% 80% at 50% 0%, black 25%, transparent 75%); }
  nav { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px);
    background: color-mix(in srgb, var(--bg) 78%, transparent); border-bottom: 1px solid var(--border); }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
  .brand .dot { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #04120c;
    background: var(--accent); font-weight: 900; }
  nav .links { display: flex; gap: 26px; align-items: center; }
  nav .links a { color: var(--dim); font-size: 14px; }
  nav .links a:hover { color: var(--text); }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 11px;
    font-weight: 600; font-size: 15px; cursor: pointer; transition: transform .12s, background .12s, opacity .12s; border: none; }
  .btn.primary { background: var(--accent); color: #04120c; }
  .btn.primary:hover { transform: translateY(-2px); }
  .btn.ghost { border: 1px solid var(--border); color: var(--text); background: transparent; }
  .btn.ghost:hover { background: var(--panel); }
  .btn.sm { padding: 9px 16px; font-size: 14px; }
  /* hero */
  header { padding: 96px 0 70px; text-align: center; }
  .badge { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); background: color-mix(in srgb, var(--accent) 10%, transparent);
    padding: 7px 16px; border-radius: 999px; margin-bottom: 28px; }
  .badge .d { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  h1 { font-size: clamp(40px, 6.5vw, 74px); font-weight: 850; letter-spacing: -0.035em; line-height: 1.03; }
  .sub { font-size: clamp(18px, 2.4vw, 23px); color: var(--dim); margin: 26px auto 0; max-width: 620px; }
  .hero-cta { display: flex; gap: 14px; justify-content: center; margin-top: 38px; flex-wrap: wrap; }
  /* sections */
  section { padding: 70px 0; }
  .eyebrow { text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 2px; color: var(--accent); margin-bottom: 16px; }
  .sec-title { text-align: center; font-size: clamp(28px, 4vw, 44px); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 14px; }
  .sec-sub { text-align: center; color: var(--dim); font-size: 18px; max-width: 560px; margin: 0 auto 48px; }
  /* metrics */
  .metrics { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
  .metric { flex: 1; min-width: 180px; text-align: center; padding: 28px; border: 1px solid var(--border);
    border-radius: 16px; background: var(--panel); }
  .metric .v { font-size: 46px; font-weight: 850; color: var(--accent); letter-spacing: -0.02em; }
  .metric .l { color: var(--dim); font-size: 15px; margin-top: 6px; }
  /* features */
  .feat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .feat { padding: 30px; border: 1px solid var(--border); border-radius: 18px;
    background: linear-gradient(180deg, var(--panel), var(--bg2)); transition: transform .15s, border-color .15s; }
  .feat:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .feat .ic { width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; font-size: 28px;
    background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent); }
  .feat h3 { font-size: 21px; font-weight: 700; margin-top: 22px; }
  .feat p { color: var(--dim); font-size: 15px; margin-top: 10px; }
  /* testimonials */
  .quotes { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .quote { padding: 30px; border: 1px solid var(--border); border-radius: 18px; background: var(--panel); }
  .quote p { font-size: 18px; }
  .quote .who { margin-top: 20px; font-size: 14px; color: var(--dim); }
  .quote .who b { color: var(--text); }
  /* pricing */
  .plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 960px; margin: 0 auto; }
  .plan { padding: 34px; border: 1px solid var(--border); border-radius: 20px; background: var(--panel); display: flex; flex-direction: column; }
  .plan.hot { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 20px 60px color-mix(in srgb, var(--accent) 16%, transparent); position: relative; }
  .plan.hot::before { content: "Popular"; position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #04120c; font-size: 12px; font-weight: 700; padding: 4px 14px; border-radius: 999px; }
  .plan .pname { font-size: 15px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  .plan .price { font-size: 44px; font-weight: 850; margin: 14px 0 4px; letter-spacing: -0.02em; }
  .plan .price span { font-size: 16px; color: var(--dim); font-weight: 500; }
  .plan ul { list-style: none; margin: 22px 0; display: flex; flex-direction: column; gap: 12px; }
  .plan li { display: flex; gap: 10px; color: var(--dim); font-size: 15px; }
  .plan li::before { content: "✓"; color: var(--accent); font-weight: 700; }
  .plan .btn { justify-content: center; margin-top: auto; }
  /* faq */
  .faq { max-width: 760px; margin: 0 auto; }
  .qa { border-bottom: 1px solid var(--border); }
  .qa summary { cursor: pointer; padding: 22px 0; font-size: 18px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 20px; }
  .qa summary::-webkit-details-marker { display: none; }
  .qa summary::after { content: "+"; color: var(--accent); font-size: 24px; line-height: 1; }
  .qa[open] summary::after { content: "–"; }
  .qa p { color: var(--dim); padding: 0 0 22px; font-size: 16px; }
  /* final cta */
  .final { text-align: center; background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 14%, var(--panel)), var(--bg2));
    border: 1px solid var(--border); border-radius: 28px; padding: 64px 32px; margin: 40px 0; }
  .final h2 { font-size: clamp(30px, 4.5vw, 46px); font-weight: 850; letter-spacing: -0.02em; }
  .final p { color: var(--dim); font-size: 19px; margin-top: 14px; }
  footer { padding: 40px 0 60px; border-top: 1px solid var(--border); color: var(--faint); font-size: 14px; text-align: center; }
  footer a { color: var(--accent); }
  .reveal { opacity: 0; transform: translateY(26px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (max-width: 640px) { nav .links a:not(.btn) { display: none; } header { padding: 64px 0 48px; } }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid-bg"></div>

  <nav><div class="wrap">
    <div class="brand"><span class="dot" id="brand-dot">·</span><span id="brand-name">Product</span></div>
    <div class="links" id="nav-links"></div>
  </div></nav>

  <header><div class="wrap">
    <div id="badge-wrap"></div>
    <h1 id="headline"></h1>
    <p class="sub" id="subheadline"></p>
    <div class="hero-cta" id="hero-cta"></div>
  </div></header>

  <section id="metrics-sec" style="display:none"><div class="wrap reveal"><div class="metrics" id="metrics"></div></div></section>

  <section id="features-sec"><div class="wrap reveal">
    <div class="eyebrow">FEATURES</div>
    <div class="sec-title" id="features-title">Everything you need</div>
    <div class="feat-grid" id="features" style="margin-top:36px"></div>
  </div></section>

  <section id="quotes-sec" style="display:none"><div class="wrap reveal">
    <div class="eyebrow">LOVED BY USERS</div>
    <div class="sec-title">Don't take our word for it</div>
    <div class="quotes" id="quotes" style="margin-top:36px"></div>
  </div></section>

  <section id="pricing-sec" style="display:none"><div class="wrap reveal">
    <div class="eyebrow">PRICING</div>
    <div class="sec-title">Simple, honest pricing</div>
    <div class="plans" id="plans" style="margin-top:40px"></div>
  </div></section>

  <section id="faq-sec" style="display:none"><div class="wrap reveal">
    <div class="eyebrow">FAQ</div>
    <div class="sec-title">Questions & answers</div>
    <div class="faq" id="faq" style="margin-top:32px"></div>
  </div></section>

  <section><div class="wrap reveal"><div class="final">
    <h2 id="cta-headline"></h2>
    <p id="cta-sub"></p>
    <div style="margin-top:30px" id="cta-btn"></div>
  </div></div></section>

  <footer><div class="wrap">
    <span id="footer-brand">Product</span> · Built on <a href="https://deployzy.com">Deployzy</a>
  </div></footer>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "");
  let d;
  try { d = await (await fetch("content.json")).json(); } catch (e) { console.error(e); return; }

  const root = document.documentElement;
  const theme = d.theme || {};
  if (theme.accent) root.style.setProperty("--accent", theme.accent);
  root.setAttribute("data-mode", theme.mode === "light" ? "light" : "dark");

  const meta = d.meta || {};
  document.title = meta.title || (d.brand && d.brand.name) || "Landing";
  if (meta.description) document.querySelector('meta[name=description]').setAttribute("content", meta.description);

  const brand = d.brand || {};
  $("brand-name").textContent = brand.name || "Product";
  $("footer-brand").textContent = brand.name || "Product";
  $("brand-dot").textContent = (brand.name || "P")[0].toUpperCase();

  const btn = (c, cls) => c ? `<a class="btn ${cls}" href="${esc(c.url || "#")}">${esc(c.label)}</a>` : "";
  $("nav-links").innerHTML =
    (brand.nav_links || []).map(l => `<a href="#">${esc(l)}</a>`).join("") +
    btn((d.hero || {}).cta_primary, "primary sm");

  const hero = d.hero || {};
  if (hero.badge) $("badge-wrap").innerHTML = `<div class="badge"><span class="d"></span>${esc(hero.badge)}</div>`;
  $("headline").textContent = hero.headline || "";
  $("subheadline").textContent = hero.subheadline || "";
  $("hero-cta").innerHTML = btn(hero.cta_primary, "primary") + btn(hero.cta_secondary, "ghost");

  const metrics = d.metrics || [];
  if (metrics.length) {
    $("metrics-sec").style.display = "";
    $("metrics").innerHTML = metrics.map(m => `<div class="metric"><div class="v">${esc(m.value)}</div><div class="l">${esc(m.label)}</div></div>`).join("");
  }

  $("features").innerHTML = (d.features || []).map(f => `
    <div class="feat"><div class="ic">${esc(f.emoji || "✦")}</div>
      <h3>${esc(f.title)}</h3><p>${esc(f.description)}</p></div>`).join("");

  const quotes = d.testimonials || [];
  if (quotes.length) {
    $("quotes-sec").style.display = "";
    $("quotes").innerHTML = quotes.map(q => `
      <div class="quote"><p>“${esc(q.quote)}”</p>
        <div class="who"><b>${esc(q.author)}</b>${q.role ? " · " + esc(q.role) : ""}</div></div>`).join("");
  }

  const plans = d.pricing || [];
  if (plans.length) {
    $("pricing-sec").style.display = "";
    $("plans").innerHTML = plans.map(p => `
      <div class="plan ${p.highlighted ? "hot" : ""}">
        <div class="pname">${esc(p.name)}</div>
        <div class="price">${esc(p.price)}${p.period ? `<span>/${esc(p.period)}</span>` : ""}</div>
        <ul>${(p.features || []).map(f => `<li>${esc(f)}</li>`).join("")}</ul>
        <a class="btn ${p.highlighted ? "primary" : "ghost"}" href="#">${esc(p.cta || "Get started")}</a>
      </div>`).join("");
  }

  const faq = d.faq || [];
  if (faq.length) {
    $("faq-sec").style.display = "";
    $("faq").innerHTML = faq.map(f => `<details class="qa"><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("");
  }

  const cta = d.cta || {};
  $("cta-headline").textContent = cta.headline || "Ready to get started?";
  $("cta-sub").textContent = cta.sub || "";
  $("cta-btn").innerHTML = btn(cta.button, "primary");

  const io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) e.target.classList.add("in"); }), { threshold: 0.1 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
})();
</script>
</body>
</html>
