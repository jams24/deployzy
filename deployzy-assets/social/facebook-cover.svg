<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="60%" stop-color="#0A0F1D" />
      <stop offset="100%" stop-color="#03050A" />
    </linearGradient>
    
    <!-- Neon Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M 70 0 L 0 0 0 70" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.3" />
    </pattern>
    
    <!-- Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Center Design: Stacked logo and text for standard social banner -->
  <g transform="translate(600, 270)" text-anchor="middle">
    <!-- Rocket & Brackets Logo (scaled up to size 180x180) -->
    <g transform="translate(-90, -160) scale(2.81)">
      <!-- Left Bracket (Cyan) -->
      <path d="M 22 12 H 18 A 4 4 0 0 0 14 16 V 28 A 4 4 0 0 1 10 32 A 4 4 0 0 1 14 36 V 48 A 4 4 0 0 0 18 52 H 22" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Right Bracket (Green) -->
      <path d="M 42 12 H 46 A 4 4 0 0 1 50 16 V 28 A 4 4 0 0 0 54 32 A 4 4 0 0 0 50 36 V 48 A 4 4 0 0 1 46 52 H 42" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Rocket rotated 45 degrees -->
      <g transform="translate(32, 32) rotate(45) translate(-32, -32)">
        <path d="M 29 37 Q 26 44 24 50" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
        <path d="M 32 37 V 53" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
        <path d="M 35 37 Q 38 44 40 50" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
        <path d="M 27 26 L 19 32 V 36 H 27" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M 37 26 L 45 32 V 36 H 37" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M 32 10 Q 38 20 37 36 H 27 Q 26 20 32 10 Z" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M 32 12 V 36" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" />
      </g>
    </g>

    <!-- Wordmark -->
    <text y="70" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="800" letter-spacing="-2">
      <tspan fill="#F9FAFB">Deploy</tspan><tspan fill="#34D399">zy</tspan>
    </text>
    
    <!-- Tagline -->
    <text y="130" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#22D3EE" filter="url(#glowCyan)" letter-spacing="0.5">
      Deploy apps. Ship faster.
    </text>
    
    <!-- Description -->
    <text y="180" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94A3B8" font-weight="500">
      One platform for your code, databases, tunnels, and custom servers.
    </text>
  </g>
</svg>
