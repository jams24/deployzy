<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" fill="none" width="1584" height="396">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="60%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    
    <!-- Neon Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="55" height="55" patternUnits="userSpaceOnUse">
      <path d="M 55 0 L 0 0 0 55" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.3" />
    </pattern>
    
    <!-- Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bgGrad)" />
  <rect width="1584" height="396" fill="url(#grid)" />

  <!-- Abstract network overlay -->
  <g opacity="0.25">
    <path d="M 950 100 L 1150 100 L 1250 200 L 1450 200" stroke="#1E293B" stroke-width="2" />
    <path d="M 1100 280 L 1250 200" stroke="#1E293B" stroke-width="2" />
    <circle cx="950" cy="100" r="5" fill="#22D3EE" />
    <circle cx="1250" cy="200" r="6" fill="#34D399" />
    <circle cx="1450" cy="200" r="5" fill="#22D3EE" />
  </g>

  <!-- Left Side: Brand Identity -->
  <g transform="translate(100, 90)">
    <!-- Rocket & Brackets Logo (scaled up to size 216x216) -->
    <g transform="scale(3.38)">
      <!-- Left Bracket (Cyan) -->
      <path d="M 22 12 H 18 A 4 4 0 0 0 14 16 V 28 A 4 4 0 0 1 10 32 A 4 4 0 0 1 14 36 V 48 A 4 4 0 0 0 18 52 H 22" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Right Bracket (Green) -->
      <path d="M 42 12 H 46 A 4 4 0 0 1 50 16 V 28 A 4 4 0 0 0 54 32 A 4 4 0 0 0 50 36 V 48 A 4 4 0 0 1 46 52 H 42" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Rocket rotated 45 degrees -->
      <g transform="translate(32, 32) rotate(45) translate(-32, -32)">
        <path d="M 29 37 Q 26 44 24 50" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
        <path d="M 32 37 V 53" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
        <path d="M 35 37 Q 38 44 40 50" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
        <path d="M 27 26 L 19 32 V 36 H 27" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M 37 26 L 45 32 V 36 H 37" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M 32 10 Q 38 20 37 36 H 27 Q 26 20 32 10 Z" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M 32 12 V 36" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" />
      </g>
    </g>

    <!-- Wordmark -->
    <g transform="translate(250, 120)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="84" font-weight="800" letter-spacing="-2">
        <tspan fill="#F9FAFB">Deploy</tspan><tspan fill="#34D399">zy</tspan>
      </text>
      <text y="45" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#94A3B8" letter-spacing="1">
        THE MULTI-VPS &amp; SERVER PLATFORM
      </text>
    </g>
  </g>

  <!-- Right Side: Tagline -->
  <g transform="translate(1020, 140)" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif">
    <text font-size="32" font-weight="700" fill="#22D3EE" filter="url(#glowCyan)">Deploy apps. Ship faster.</text>
    <text y="42" font-size="18" fill="#94A3B8">Connect GitHub • Deploy to your VPS • Managed Databases</text>
    <text y="75" font-size="16" fill="#64748B" font-style="italic">One unified developer platform instead of five tools.</text>
  </g>
</svg>
