<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" fill="none" width="1500" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0A0F1D" />
      <stop offset="100%" stop-color="#03050A" />
    </linearGradient>
    
    <!-- Neon Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4" />
    </pattern>
    
    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bgGrad)" />
  <rect width="1500" height="500" fill="url(#grid)" />

  <!-- Abstract Tech Grid Lines & Nodes in Background -->
  <g opacity="0.3">
    <!-- Server nodes & connection lines -->
    <path d="M 900 150 L 1150 150 L 1250 250 L 1400 250" stroke="#1E293B" stroke-width="2" stroke-dasharray="5 5" />
    <path d="M 1050 350 L 1150 350 L 1250 250" stroke="#1E293B" stroke-width="2" />
    <path d="M 1250 250 L 1250 100" stroke="#1E293B" stroke-width="2" />
    
    <!-- Nodes -->
    <circle cx="900" cy="150" r="6" fill="#22D3EE" filter="url(#glowCyan)" />
    <circle cx="1150" cy="150" r="4" fill="#1E293B" />
    <circle cx="1050" cy="350" r="6" fill="#34D399" filter="url(#glowGreen)" />
    <circle cx="1150" cy="350" r="4" fill="#1E293B" />
    <circle cx="1250" cy="250" r="8" fill="#22D3EE" />
    <circle cx="1250" cy="100" r="5" fill="#34D399" />
    <circle cx="1400" cy="250" r="6" fill="#22D3EE" />
  </g>

  <!-- Giant faint code brackets in background -->
  <text x="1100" y="380" font-family="monospace" font-size="280" font-weight="bold" fill="#1E293B" opacity="0.1">{</text>
  <text x="1300" y="380" font-family="monospace" font-size="280" font-weight="bold" fill="#1E293B" opacity="0.1">}</text>

  <!-- Left Side: Brand Identity (Logo + Name) -->
  <g transform="translate(120, 140)">
    <!-- Rocket & Brackets Logo (scaled up to size 220x220) -->
    <g transform="scale(3.43)">
      <!-- Left Bracket (Cyan) -->
      <path d="M 22 12 H 18 A 4 4 0 0 0 14 16 V 28 A 4 4 0 0 1 10 32 A 4 4 0 0 1 14 36 V 48 A 4 4 0 0 0 18 52 H 22" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Right Bracket (Green) -->
      <path d="M 42 12 H 46 A 4 4 0 0 1 50 16 V 28 A 4 4 0 0 0 54 32 A 4 4 0 0 0 50 36 V 48 A 4 4 0 0 1 46 52 H 42" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Rocket rotated 45 degrees -->
      <g transform="translate(32, 32) rotate(45) translate(-32, -32)">
        <!-- Flame trails -->
        <path d="M 29 37 Q 26 44 24 50" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
        <path d="M 32 37 V 53" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
        <path d="M 35 37 Q 38 44 40 50" stroke="#34D399" stroke-width="2" stroke-linecap="round" />

        <!-- Left & Right Fins -->
        <path d="M 27 26 L 19 32 V 36 H 27" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M 37 26 L 45 32 V 36 H 37" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

        <!-- Rocket Body -->
        <path d="M 32 10 Q 38 20 37 36 H 27 Q 26 20 32 10 Z" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

        <!-- Center Line -->
        <path d="M 32 12 V 36" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" />
      </g>
    </g>

    <!-- Wordmark -->
    <g transform="translate(260, 125)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="800" letter-spacing="-2">
        <tspan fill="#F9FAFB">Deploy</tspan><tspan fill="#34D399">zy</tspan>
      </text>
      <text y="50" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#94A3B8" letter-spacing="1">
        THE MULTI-VPS &amp; SERVER PLATFORM
      </text>
    </g>
  </g>

  <!-- Tagline / Features list in the Center-Right -->
  <g transform="translate(1000, 160)" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif">
    <!-- Tagline -->
    <text font-size="36" font-weight="700" fill="#22D3EE" filter="url(#glowCyan)">Deploy apps. Ship faster.</text>
    
    <!-- Checklist items -->
    <g transform="translate(0, 50)" font-size="20" font-weight="500" fill="#94A3B8">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="10" cy="-6" r="4" fill="#34D399" />
        <text x="28">Connect GitHub &amp; Go Live in 30s</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(0, 40)">
        <circle cx="10" cy="-6" r="4" fill="#34D399" />
        <text x="28">Managed Databases &amp; Secure Tunnels</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(0, 80)">
        <circle cx="10" cy="-6" r="4" fill="#34D399" />
        <text x="28">Self-hostable &amp; Bring Your Own VPS</text>
      </g>
    </g>
  </g>
</svg>
