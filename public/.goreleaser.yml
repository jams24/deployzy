version: 2

# Public CLI releases for jams24/deployzy-cli.
# Synced from the private monorepo (public/.goreleaser.yml) — edit it there.
# Only the CLI is released; the platform server is not distributed.

project_name: deployzy

before:
  hooks:
    - go mod tidy -C cli

builds:
  - id: deployzy
    main: ./cmd/deployzy
    dir: cli
    binary: deployzy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/serverme/serverme/proto.Version={{ .Version }}

archives:
  - id: cli
    builds:
      - deployzy
    # npm-package/bin/install.js and install.sh download exactly this name.
    name_template: "deployzy_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

# Needs a HOMEBREW_TAP_TOKEN secret with write access to jams24/homebrew-deployzy.
brews:
  - name: deployzy
    ids:
      - cli
    repository:
      owner: jams24
      name: homebrew-deployzy
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://deployzy.com"
    description: "Deployzy CLI — deploy apps, expose localhost (tunnels) & manage databases"
    license: "MIT"
    install: |
      bin.install "deployzy"
    test: |
      system "#{bin}/deployzy", "version"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: jams24
    name: deployzy-cli
  draft: false
  prerelease: auto

changelog:
  # The public repo's history is one sync commit per release, so its
  # commit log carries no useful changelog.
  disable: true
